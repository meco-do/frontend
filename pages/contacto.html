<h4> Contactanos con tus preguntas</h4>

<form
  class="form"
  action="https://formspree.io/f/xeaerknj"
  method="POST"
>

<div>
<label class="form__label" for="nombre">Nombre:</label>
<input 
class="form__textarea"
id="nombre"
name="nombre"
type="text"
placeholder="Juan"
required
/>
</div>  

<div>
<label class="form__label" for="apellido">Apellido:</label>
<input 
class="form__textarea"
id="apellido"
name="apellido"
type="text"
placeholder="Perez"
required
/>
</div>  

<div>
<label class="form__label" for="email">Correo electronico:</label>
<input 
class="form__input"
id="email"
name="email"
type="email"
placeholder="juanperez@email.com"
required
/>
</div> 


<div>
<label class="form__label" for="motivo">Motivo:</label>
<select id="motivo" name="motivo"> 
<option value=""> - Selecciona una opcion - </option>
<option value="consulta"> Consulta </option>
<option value="soporte"> soporte </option>
<option value="otros"> otros </option>
</select>

</div> 

<div>
  <label class="form__label">
    Tu mensaje:
    <textarea 
    class="form__textarea"
    name="message">
    </textarea>
  </label>
  </div> 


  <button class ="btn" type="submit">Enviar</button>
</form>
